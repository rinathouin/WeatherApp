<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>
    <title>Document</title>
  </head>
  <body>
    <div class="weather-app">
      <header>
        <form id="search-form">
          <input
            class="search-form-input"
            type="search"
            placeholder="Enter a city.."
            id="city-input"
            required
          />
          <button
            class="search-form-button"
            type="submit"
            id="search-btn"
            aria-label="Search"
          >
            🔍
          </button>
        </form>
      </header>
      <main>
        <div class="sub-header">
          <div class="location-details">
            <h1 class="city-name" id="city">City</h1>
          </div>
          <div class="current-temperature-container">
            <div class="current-temp-logo" id="icon"></div>
            <div class="current-temperature" id="current-temp">100</div>
            <div class="current-temp-units">°F</div>
          </div>
        </div>
        <p class="weather-details">
          <span id="time"></span>
          <span id="description"></span> <br />
          Humidity:
          <strong class="humidity"><span id="humidity"></span>%</strong>, Wind:
          <strong class="speed"><span id="speed"></span></strong>
        </p>
        <div class="weather-forecast" id="forecast"></div>
      </main>

      <footer>
        Coded by
        <a href="https://github.com/rinathouin" target="_blank"
          >Cesarina Lucarelli</a
        >, is open-source on
        <a href="https://github.com/rinathouin/WeatherApp" target="_blank">
          GitHub</a
        >
        and hosted on
        <a href="https://currentweatherapp2026.netlify.app/" target="_blank"
          >Netlify</a
        >
      </footer>
    </div>

    <script src="src/java.js"></script>
  </body>
</html>
