<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <form id="search-form">
        <input
          type="search"
          placeholder="Enter a city.."
          id="city-input"
          required
        />
        <input type="submit" value="Search" id="city-output" />
      </form>
    </header>
    <main>
      <div class="sub-header">
        <h1 class="current-city">City</h1>
        <h2>Weekday Day Month</h2>
        <div class="units-button">
          <button class="units-setting" id="switch-units">Celsius</button>
        </div>
      </div>
      <div class="current-temperature">100°F</div>
      <div class="temperature-label">Sunny</div>
      <div class="current-stats">
        <div class="current-temp-range">
          <div class="current-temp-low">89°F</div>
          <div class="current-temp-high">/110°F</div>
        </div>
        <div class="current-wind-card">
          <div class="current-wind">7mph</div>
          <div class="wind-label">WIND</div>
        </div>
        <div class="current-rain-card">
          <div class="current-rain">0%</div>
          <div class="rain-label">RAIN</div>
        </div>
        <div class="current-sun-range">
          <div class="sun-card">
            <div class="sun-time">5:30</div>
            <div class="sun-label">SUNRISE</div>
          </div>
          <div class="sun-card">
            <div class="sun-time">8:30</div>
            <div class="sun-label">SUNSET</div>
          </div>
        </div>
      </div>
      <div class="future-days">
        <h3 class="future-days-header">Next 5 days</h3>
        <div class="forecast-container">
          <div class="forecast-day">
            <div class="day-name">Mon</div>
            <div class="day-logo">IMG</div>
            <div class="temp-range">
              <div class="day-temp-low">89°F</div>
              <div class="day-temp-high">/110°F</div>
            </div>
          </div>
          <div class="forecast-day">
            <div class="day-name">Tue</div>
            <div class="day-logo">IMG</div>
            <div class="temp-range">
              <div class="day-temp-low">89°F</div>
              <div class="day-temp-high">/110°F</div>
            </div>
          </div>
          <div class="forecast-day">
            <div class="day-name">Wed</div>
            <div class="day-logo">IMG</div>
            <div class="temp-range">
              <div class="day-temp-low">89°F</div>
              <div class="day-temp-high">/110°F</div>
            </div>
          </div>
          <div class="forecast-day">
            <div class="day-name">Thu</div>
            <div class="day-logo">IMG</div>
            <div class="temp-range">
              <div class="day-temp-low">89°F</div>
              <div class="day-temp-high">/110°F</div>
            </div>
          </div>
          <div class="forecast-day">
            <div class="day-name">Fri</div>
            <div class="day-logo">IMG</div>
            <div class="temp-range">
              <div class="day-temp-low">89°F</div>
              <div class="day-temp-high">/110°F</div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      Coded by
      <a href="https://github.com/rinathouin" target="_blank"
        >Cesarina Lucarelli</a
      >, is open-source on
      <a href="https://github.com/rinathouin/WeatherApp" target="_blank">
        GitHub</a
      >
      and hosted on
      <a href="https://currentweatherapp2026.netlify.app/" target="_blank"
        >Netlify</a
      >
    </footer>
  </body>
</html>
