<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <title>Document</title>
  </head>
  <body>
    <div class="weather-app">
      <header>
        <form id="search-form">
          <input
            class="search-form-input"
            type="search"
            placeholder="Enter a city.."
            id="city-input"
            required
          />
          <button
            class="search-form-button"
            type="submit"
            id="search-btn"
            aria-label="Search"
          >
            🔍
          </button>
        </form>
      </header>
      <main>
        <div class="sub-header">
          <div class="locations-details">
            <h1 class="city-name">City</h1>
            <h2 class="current-date">Weekday Day Month</h2>
          </div>
          <div class="current-temperature-container">
            <div class="current-temp-logo">☀️</div>
            <div class="current-temperature">100</div>
            <div class="current-temp-units">°F</div>
          </div>
        </div>
        <p class="weather-details">
          Sunny <br />
          Humidity: <strong class="humidity">15%</strong>, Wind:
          <strong class="speed">7mph</strong>
        </p>
      </main>

      <footer>
        Coded by
        <a href="https://github.com/rinathouin" target="_blank"
          >Cesarina Lucarelli</a
        >, is open-source on
        <a href="https://github.com/rinathouin/WeatherApp" target="_blank">
          GitHub</a
        >
        and hosted on
        <a href="https://currentweatherapp2026.netlify.app/" target="_blank"
          >Netlify</a
        >
      </footer>
    </div>
  </body>
</html>
